name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Only macOS on ARM64 is supported until the vsql amalgamation release.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race ./...
