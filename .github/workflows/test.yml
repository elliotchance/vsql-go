name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            arch: x86-64
            runner: ubuntu-latest
          - os: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm
          - os: macOS
            arch: x86-64
            runner: macos-15-intel
          - os: macOS
            arch: ARM64
            runner: macos-latest
          - os: Windows
            arch: x86-64
            runner: windows-latest
          - os: Windows
            arch: ARM64
            runner: windows-11-arm
            # Go has no race detector for windows/arm64.
            race: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # The runner's gcc is MinGW for x86-64, so cgo needs a C compiler for
      # ARM64 (clang from MSYS2's CLANGARM64).
      - if: matrix.os == 'Windows' && matrix.arch == 'ARM64'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          install: mingw-w64-clang-aarch64-clang
      - if: matrix.os == 'Windows' && matrix.arch == 'ARM64'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\clangarm64\bin" >> $env:GITHUB_PATH
          "CC=clang" >> $env:GITHUB_ENV
      - run: go vet ./...
      - run: go test ${{ matrix.race != false && '-race' || '' }} ./...
      # Every statement must be covered by the tests. The code isn't specific
      # to an OS, so it's only measured on one.
      - if: matrix.os == 'Linux' && matrix.arch == 'x86-64'
        name: Check that test coverage is 100%
        run: |
          go test -coverprofile=coverage.out ./vsql
          go tool cover -func=coverage.out | awk '$3 != "100.0%"'
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')"
          if [ "$total" != "100.0%" ]; then
            echo "::error::Test coverage is $total, but it must be 100%"
            exit 1
          fi
